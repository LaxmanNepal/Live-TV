name: Sync TV Channel Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/sync_channels.py"
      - "scripts/check_streams.py"

permissions:
  contents: write

concurrency:
  group: tv-data-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync complete upstream channel list
        run: python scripts/sync_channels.py

      - name: Check HLS stream reachability
        run: python scripts/check_streams.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for file in ["data/source-list.json", "data/channels.json", "data/categories.json", "data/stream-status.json"]:
              json.loads(Path(file).read_text(encoding="utf-8"))
              print(f"OK: {file}")
          channels = json.loads(Path("data/channels.json").read_text())
          assert channels["channelCount"] > 0
          assert channels["liveStreamCount"] > 0
          PY

      - name: Commit updated TV data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-list.json data/channels.json data/categories.json data/stream-status.json
          if git diff --cached --quiet; then
            echo "No TV data changes."
          else
            git commit -m "chore: sync and validate TV streams"
            git push
          fi
