name: Sync TV Channel Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/sync_channels.py"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync source list and generate normalized data
        run: python scripts/sync_channels.py

      - name: Commit updated TV data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-list.json data/channels.json data/categories.json
          if git diff --cached --quiet; then
            echo "No TV data changes."
          else
            git commit -m "chore: sync TV channel data"
            git push
          fi
